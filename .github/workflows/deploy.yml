# =============================================================================
# Greenlens — GitHub Actions CI/CD
# Path in repo: .github/workflows/deploy.yml
#
# Triggers:
#   - push to `main` → build + deploy
#   - manual dispatch with optional tag override
#
# Required GitHub Secrets (Settings → Secrets and variables → Actions):
#   VPS_HOST           e.g. 203.0.113.42
#   VPS_USER           appuser
#   VPS_SSH_KEY        private key (ed25519)
#
# Rollback: deploy script snapshots :latest before update. If health/smoke
# test fails, it re-tags the previous image and restarts API automatically.
# =============================================================================

name: Deploy to VPS

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy (default: commit sha)'
        required: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: capstonne-project/greenlens-api

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Cache nuget
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Unit tests
        run: dotnet test --no-build --configuration Release --verbosity normal

  build-and-push:
    name: Build & push image
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-push
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Copy compose file to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host:     ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key:      ${{ secrets.VPS_SSH_KEY }}
          source:   "docker-compose.yml"
          target:   "/opt/greenlens/"

      - name: SSH deploy
        uses: appleboy/ssh-action@v1.0.3
        env:
          FULL_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
        with:
          host:     ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key:      ${{ secrets.VPS_SSH_KEY }}
          envs: FULL_IMAGE
          script_stop: true
          command_timeout: 20m
          script: |
            set -euo pipefail
            cd /opt/greenlens

            STATE_FILE="/opt/greenlens/.last-good-image"
            IMAGE_REPO="${FULL_IMAGE%%:*}"

            rollback() {
              local reason="${1:-Deploy verification failed}"
              echo "❌ ${reason}"
              echo "─── Failed container logs (last 80 lines) ───"
              sudo docker logs greenlens-api --tail 80 2>&1 || true

              if [ -n "${PREV_LATEST_ID:-}" ]; then
                echo "Rolling back to previous :latest image (${PREV_LATEST_ID})"
                sudo docker tag "${PREV_LATEST_ID}" "${IMAGE_REPO}:latest"
              elif [ -f "${STATE_FILE}" ]; then
                local last_good
                last_good="$(cat "${STATE_FILE}")"
                echo "Rolling back to last known good: ${last_good}"
                sudo docker pull "${last_good}" || true
                sudo docker tag "${last_good}" "${IMAGE_REPO}:latest"
              else
                echo "⚠️ No rollback target — manual fix required on VPS"
                exit 1
              fi

              sudo docker compose --env-file .env.production up -d --no-deps api

              echo "Waiting for rollback to become healthy..."
              for i in $(seq 1 30); do
                status=$(sudo docker inspect --format='{{.State.Health.Status}}' greenlens-api 2>/dev/null || echo "starting")
                if [ "$status" = "healthy" ]; then
                  break
                fi
                echo "Rollback health ($i/30)... status=${status}"
                sleep 2
              done

              if curl -fsS http://localhost:8080/health >/dev/null; then
                echo "✅ Rollback succeeded — API restored on previous image"
              else
                echo "❌ Rollback attempted but API still down — check VPS manually"
              fi
              exit 1
            }

            # Login to GHCR (requires a PAT stored in .env.production as GHCR_TOKEN)
            source .env.production
            echo "${GHCR_TOKEN}" \
              | sudo docker login ghcr.io -u "${GHCR_USER}" --password-stdin

            # Snapshot current :latest BEFORE overwriting — used for instant rollback
            PREV_LATEST_ID="$(sudo docker images --no-trunc --format '{{.ID}}' "${IMAGE_REPO}:latest" 2>/dev/null | head -1 || true)"
            echo "Previous :latest image ID: ${PREV_LATEST_ID:-none}"
            echo "Deploying: ${FULL_IMAGE}"
            echo "Pulling image (may take several minutes on slow VPS links)..."

            sudo docker pull "${FULL_IMAGE}"
            sudo docker tag "${FULL_IMAGE}" "${IMAGE_REPO}:latest"

            # Bring up API only (postgres/redis untouched)
            sudo docker compose --env-file .env.production up -d --no-deps api

            # Wait for healthcheck — must pass before we accept the deploy
            HEALTH_OK=false
            for i in $(seq 1 30); do
              status=$(sudo docker inspect --format='{{.State.Health.Status}}' greenlens-api 2>/dev/null || echo "starting")
              if [ "$status" = "healthy" ]; then
                echo "✅ API healthy"
                HEALTH_OK=true
                break
              fi
              running=$(sudo docker inspect --format='{{.State.Status}}' greenlens-api 2>/dev/null || echo "unknown")
              echo "Waiting for healthy ($i/30)... status=${status} running=${running}"
              sleep 2
            done

            if [ "${HEALTH_OK}" != "true" ]; then
              rollback "Health check did not pass within 60s"
            fi

            if ! curl -fsS http://localhost:8080/health; then
              rollback "Smoke test failed"
            fi

            # Record successful deploy for future rollbacks (no sudo — CI user owns /opt/greenlens)
            printf '%s\n' "${FULL_IMAGE}" > "${STATE_FILE}"

            # Cleanup old deploy tags — keep :latest, current sha, + 2 previous sha (rollback buffer)
            CURRENT_TAG="${FULL_IMAGE##*:}"
            echo "Cleaning up old sha-* tags..."
            while IFS= read -r tag; do
              [ -n "${tag}" ] || continue
              sudo docker rmi "${IMAGE_REPO}:${tag}" 2>/dev/null || true
            done < <(
              sudo docker images "${IMAGE_REPO}" --format '{{.CreatedAt}}\t{{.Tag}}' \
                | grep $'\tsha-' \
                | sort -r \
                | awk -F'\t' -v current="${CURRENT_TAG}" '{
                    tag=$2
                    if (tag == current) next
                    if (++kept <= 2) next
                    print tag
                  }'
            )
            sudo docker image prune -af --filter "until=72h"
            sudo docker builder prune -af --filter "until=72h" 2>/dev/null || true

            echo "✅ Deploy succeeded: ${FULL_IMAGE}"

